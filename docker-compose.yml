services:
  backend:
    build:
      context: .
      dockerfile: Backend/Dockerfile
    env_file:
      - ./Backend/.env
    environment:
      - DATABASE_URL=sqlite:////data/plomeria.db
    volumes:
      - plomeria_db:/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8081:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  plomeria_db:
