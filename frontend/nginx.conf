server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API REST — se preserva el prefijo /api porque el backend monta todo bajo él
    # (main.py: API_PREFIX="/api"). Con barra final se perdía el prefijo y daba 404.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket del chat — requiere los headers de upgrade.
    location /ws/ {
        proxy_pass http://backend:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # Archivos subidos (fotos de perfil) servidos por el backend.
    location /uploads/ {
        proxy_pass http://backend:8000/uploads/;
        proxy_set_header Host $host;
    }

    # SPA: el front navega por estado (sin react-router), igual dejamos el fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
