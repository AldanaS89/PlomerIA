server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # El front pega a /api/... y el backend expone /auth, /plomeros, etc. (sin /api).
    # La barra final en proxy_pass hace que nginx quite el prefijo /api/ al reenviar:
    #   /api/auth/login  ->  http://backend:8000/auth/login
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: el front navega por estado (sin react-router), igual dejamos el fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
